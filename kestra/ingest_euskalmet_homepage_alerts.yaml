id: ingest_euskalmet_homepage_alerts
namespace: llm_zoomcamp_capstone

description: |
  Refresh public Euskalmet Meteoadversa warning cards from the official homepage.
  This flow does not ingest social-media content.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: refresh_euskalmet_homepage_alerts
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: gipuzkoa-askbot-ingestion:0.2.0
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: askgipuzkoa-network
      volumes:
        - askgipuzkoa-ingestion-data:/data
    timeout: PT5M
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT2M
      maxAttempts: 3
    commands:
      - PYTHONPATH=/app /app/.venv/bin/python -m app.ingest --database /data/ingestion.sqlite euskalmet-homepage-alerts
