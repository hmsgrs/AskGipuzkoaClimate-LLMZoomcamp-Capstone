id: refresh_aemet_station_catalogue
namespace: llm_zoomcamp_capstone
disabled: true

description: Refresh AEMET station metadata and retain the Gipuzkoa subset.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: refresh_catalogue
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: gipuzkoa-askbot-ingestion:0.2.0
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: askgipuzkoa-network
      volumes:
        - askgipuzkoa-ingestion-data:/data
        - "{{ secret('AEMET_SECRET_DIR') }}:/run/secrets/aemet:ro"
    env:
      AEMET_API_KEY_PATH: /run/secrets/aemet/api.pem
    commands:
      - PYTHONPATH=/app /app/.venv/bin/python -m app.ingest --database /data/ingestion.sqlite aemet-stations
    timeout: PT10M
    retry:
      type: exponential
      interval: PT1M
      maxInterval: PT5M
      maxAttempts: 3
      maxDuration: PT20M
