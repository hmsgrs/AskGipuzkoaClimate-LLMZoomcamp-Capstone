id: create_data_snapshot
namespace: llm_zoomcamp_capstone
disabled: false

description: |
  Manually publish and verify an immutable snapshot of the fully populated working
  database. This flow has no schedule and is not required to audit the application.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: create_snapshot
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: gipuzkoa-askbot-ingestion:0.2.0
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: askgipuzkoa-network
      volumes:
        - askgipuzkoa-ingestion-data:/data
    timeout: PT15M
    commands:
      - >-
        PYTHONPATH=/app /app/.venv/bin/python -m app.snapshot create
        --database /data/ingestion.sqlite
        --output-root /data/snapshots
        --snapshot-id "{{ execution.id }}"
        --required-table sources
        --required-table weather_stations
        --required-table weather_forecasts
        --required-table weather_api_snapshots
        --required-table aemet_daily_observations
        --required-table hazard_alerts
        --require-nonempty sources
        --require-nonempty weather_stations
        --require-nonempty weather_forecasts
        --require-nonempty weather_api_snapshots
        --require-nonempty aemet_daily_observations
        --notes "Kestra-produced bounded all-source snapshot"

  - id: verify_snapshot
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: gipuzkoa-askbot-ingestion:0.2.0
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: askgipuzkoa-network
      volumes:
        - askgipuzkoa-ingestion-data:/data
    timeout: PT10M
    commands:
      - >-
        PYTHONPATH=/app /app/.venv/bin/python -m app.snapshot verify
        --snapshot "/data/snapshots/{{ execution.id }}"
