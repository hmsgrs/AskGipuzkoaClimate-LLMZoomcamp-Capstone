services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gipuzkoa_askbot}
      POSTGRES_USER: ${POSTGRES_USER:-gipuzkoa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gipuzkoa} -d ${POSTGRES_DB:-gipuzkoa_askbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
