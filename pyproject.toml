[project]
name = "gipuzkoa-weather-climate-askbot"
version = "0.1.0"
description = "Data ingestion for the Gipuzkoa weather and climate emergency askbot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "filelock>=3.32.0",
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "PyJWT[crypto]>=2.10.1",
    "pypdf>=6.14.2",
    "requests>=2.32.3",
    "streamlit>=1.59.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires external services",
]
